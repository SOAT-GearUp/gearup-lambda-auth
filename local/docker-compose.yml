# ---------------------------------------------------------------------------
# Ambiente local da Lambda: Postgres com a tabela "Clientes" (mesmo schema da
# migration da API) + a função rodando no emulador oficial da AWS.
#
#   docker compose -f local/docker-compose.yml up --build
#   curl.exe -s -X POST http://localhost:9000/2015-03-31/functions/function/invocations --data-binary "@exemplos/cpf-ativo.json"
# ---------------------------------------------------------------------------
name: gearup-lambda-auth

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: gearup_local
      POSTGRES_USER: gearup
      POSTGRES_PASSWORD: gearup-local
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gearup -d gearup_local"]
      interval: 3s
      retries: 10

  lambda:
    build:
      context: ..
    ports:
      - "127.0.0.1:9000:8080"
    environment:
      DB_HOST: postgres
      DB_NAME: gearup_local
      DB_USER: gearup
      DB_PASSWORD: gearup-local
      DB_SSL: disable
      JWT_KEY: chave-local-de-desenvolvimento-com-32-bytes-ou-mais
      AMBIENTE: local
    depends_on:
      postgres:
        condition: service_healthy
